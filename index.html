<!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, onSnapshot, doc, query, where, orderBy, serverTimestamp, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCfLEGsSclyQBk2wkm9W3mDAcMMYpa0K4w",
      authDomain: "srss-peek-lends-app.firebaseapp.com",
      projectId: "srss-peek-lends-app",
      storageBucket: "srss-peek-lends-app.firebasestorage.app",
      messagingSenderId: "858791813722",
      appId: "1:858791813722:web:38248a7ffd65a07c60ae63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_SECRET = "admin123"; 
    let currentUser = JSON.parse(localStorage.getItem('peeklens_user') || 'null');
    let currentActiveMessage = null;
    let cameraStream = null;
    let viewTimer = null;
    let isHolding = false;
    let storedImageData = null;
    let groupMessagesMap = {}; 

    if (currentUser) {
      document.getElementById('login-modal').classList.add('hidden');
      initApp();
    }

    window.handleLogin = async () => {
      const nameInput = document.getElementById('username-input').value.trim();
      if (!nameInput) return alert('Please enter your name');

      const q = query(collection(db, "users"), where("name", "==", nameInput));
      const querySnapshot = await getDocs(q);
      if (querySnapshot.empty) {
        alert('Access Denied: Your name has not been authorized by an Admin yet.');
        return;
      }

      const memberDoc = querySnapshot.docs[0];
      currentUser = { id: memberDoc.id, name: nameInput };
      localStorage.setItem('peeklens_user', JSON.stringify(currentUser));
      document.getElementById('login-modal').classList.add('hidden');
      initApp();
    };

    window.openAdminModal = () => {
      document.getElementById('admin-modal').classList.remove('hidden');
      document.getElementById('admin-login-view').classList.remove('hidden');
      document.getElementById('admin-dashboard-view').classList.add('hidden');
    };

    window.closeAdminModal = () => {
      document.getElementById('admin-modal').classList.add('hidden');
    };

    window.handleAdminLogin = () => {
      const pass = document.getElementById('admin-password-input').value;
      if (pass !== ADMIN_SECRET) {
        return alert('Incorrect Admin Password');
      }
      document.getElementById('admin-login-view').classList.add('hidden');
      document.getElementById('admin-dashboard-view').classList.remove('hidden');
      listenToApprovedMembers();
    };

    window.addApprovedMember = async () => {
      const name = document.getElementById('new-member-input').value.trim();
      if (!name) return alert('Enter a member name');

      await addDoc(collection(db, "users"), {
        name: name,
        addedAt: serverTimestamp()
      });
      document.getElementById('new-member-input').value = '';
      alert(`Member "${name}" successfully authorized!`);
    };

    function listenToApprovedMembers() {
      const q = query(collection(db, "users"), orderBy("addedAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById('approved-members-list');
        list.innerHTML = '';
        if (snapshot.empty) {
          list.innerHTML = '<div class="text-xs text-slate-500 text-center py-2">No authorized members yet.</div>';
          return;
        }
        snapshot.forEach((docSnap) => {
          const m = docSnap.data();
          list.innerHTML += `
            <div class="flex justify-between items-center bg-slate-800 p-2 rounded-lg text-xs">
              <span class="text-slate-200 font-semibold">${m.name}</span>
              <button onclick="removeMember('${docSnap.id}')" class="text-red-400 hover:text-red-300 text-[10px]">Revoke</button>
            </div>
          `;
        });
      });
    }

    window.removeMember = async (id) => {
      if (confirm('Revoke access for this user?')) {
        await deleteDoc(doc(db, "users", id));
      }
    };

    function initApp() {
      if (!currentUser) return;
      document.getElementById('user-display').innerText = `Member: ${currentUser.name}`;
      document.getElementById('login-modal').classList.add('hidden');
      listenToGroupFeed();
      listenToPrivateReactions();
      listenToViolations();
    }

    window.switchTab = (tab) => {
      ['feed', 'reactions', 'logs'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "flex-1 py-2 font-semibold text-slate-400 border-b-2 border-transparent text-sm";
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "flex-1 py-2 font-semibold text-cyan-400 border-b-2 border-cyan-400 text-sm";
    };

    function listenToGroupFeed() {
      const q = query(collection(db, "messages"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById('group-feed-list');
        list.innerHTML = '';
        groupMessagesMap = {}; 

        if (snapshot.empty) {
          list.innerHTML = '<div class="text-xs text-slate-500 text-center py-8">No active group photos right now</div>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          groupMessagesMap[docSnap.id] = msg; 

          list.innerHTML += `
            <div class="p-3 bg-slate-900 border border-cyan-500/40 rounded-xl flex items-center justify-between">
              <div>
                <div class="text-xs font-semibold text-slate-200">From: ${msg.senderName}</div>
                <div class="text-[10px] text-cyan-400">🔒 1 Unopened Group Photo</div>
              </div>
              <button onclick="openPhotoViewer('${docSnap.id}')" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium">View Photo</button>
            </div>
          `;
        });
      });
    }

    function listenToPrivateReactions() {
      if (!currentUser) return;
      const q = query(collection(db, "reactions"), where("senderId", "==", currentUser.id));
      
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById('reactions-list');
        list.innerHTML = '';

        if (snapshot.empty) {
          list.innerHTML = '<div class="col-span-2 text-xs text-slate-500 text-center py-8">No private viewer selfies captured yet.</div>';
          return;
        }

        let reactions = [];
        snapshot.forEach((docSnap) => {
          reactions.push({ id: docSnap.id, ...docSnap.data() });
        });
        
        reactions.sort((a, b) => {
          let timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          let timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return timeB - timeA;
        });

        reactions.forEach((data) => {
          list.innerHTML += `
            <div class="p-2 bg-slate-900 border border-slate-800 rounded-xl space-y-1">
              <img src="${data.reactionImage}" class="w-full h-32 object-cover rounded-lg border border-slate-800">
              <div class="text-[11px] font-bold text-slate-200">${data.viewerName}</div>
              <div class="text-[9px] ${data.isViolation ? 'text-red-400 font-bold' : 'text-cyan-400'}">
                ${data.isViolation ? '🚨 Captured during violation attempt!' : 'Viewed your broadcast'}
              </div>
            </div>
          `;
        });
      });
    }

    function listenToViolations() {
      const q = query(collection(db, "violations"), orderBy("flaggedAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById('logs-list');
        list.innerHTML = '';

        if (snapshot.empty) {
          list.innerHTML = '<div class="text-xs text-slate-500 text-center py-8">No security violations reported.</div>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const log = docSnap.data();
          list.innerHTML += `
            <div class="p-3 bg-red-950/30 border border-red-800/40 rounded-xl space-y-1">
              <div class="text-xs font-bold text-red-400">🚨 INTERACTION VIOLATION DETECTED</div>
              <div class="text-[11px] text-slate-300">Offender: <span class="font-bold text-white">${log.offenderName}</span></div>
              <div class="text-[10px] text-slate-400">Original Sender: ${log.senderName}</div>
            </div>
          `;
        });
      });
    }

    window.openSendModal = () => document.getElementById('send-modal').classList.remove('hidden');
    window.closeSendModal = () => document.getElementById('send-modal').classList.add('hidden');

    window.submitGroupPhoto = async () => {
      if (!currentUser) return alert('Please log in.');

      try {
        const memberCheck = await getDoc(doc(db, "users", currentUser.id));
        if (!memberCheck.exists()) {
          alert('Access Revoked: An administrator has revoked your access.');
          localStorage.removeItem('peeklens_user');
          location.reload();
          return;
        }
      } catch (err) {
        console.error("Authorization check failed:", err);
      }

      const fileInput = document.getElementById('photo-input');
      const file = fileInput.files[0];
      if (!file) return alert('Select an image');

      const reader = new FileReader();
      reader.onload = async (e) => {
        await addDoc(collection(db, "messages"), {
          senderId: currentUser.id,
          senderName: currentUser.name,
          imageData: e.target.result,
          createdAt: serverTimestamp()
        });
        closeSendModal();
        fileInput.value = '';
        alert('Photo broadcasted successfully to the group feed!');
      };
      reader.readAsDataURL(file);
    };

    function takeCameraFrame() {
      const video = document.getElementById('webcam-feed');
      if (!video || !cameraStream) return null;
      const reactionCanvas = document.createElement('canvas');
      reactionCanvas.width = 320;
      reactionCanvas.height = 240;
      const ctx = reactionCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, reactionCanvas.width, reactionCanvas.height);
      return reactionCanvas.toDataURL('image/jpeg', 0.6);
    }

    window.openPhotoViewer = async (msgId) => {
      const msg = groupMessagesMap[msgId];
      if (!msg) {
        alert('This photo is no longer available or has already been viewed.');
        return;
      }

      currentActiveMessage = { id: msgId, senderId: msg.senderId, senderName: msg.senderName };
      storedImageData = msg.imageData;
      
      document.getElementById('viewer-modal').classList.remove('hidden');
      document.getElementById('viewer-modal').classList.add('flex');
      
      document.getElementById('hold-instruction').classList.remove('hidden');
      document.getElementById('photo-canvas').classList.add('hidden');
      document.getElementById('timer-bar-container').classList.add('hidden');

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        const video = document.getElementById('webcam-feed');
        video.srcObject = cameraStream;
        await video.play();
      } catch (err) {
        console.warn("Camera access denied or unequipped.");
      }

      const zone = document.getElementById('touch-hold-zone');
      zone.replaceWith(zone.cloneNode(true));
      const freshZone = document.getElementById('touch-hold-zone');

      freshZone.addEventListener('touchstart', handleTouchStart, { passive: false });
      freshZone.addEventListener('touchend', handleTouchEnd);
      freshZone.addEventListener('touchcancel', handleTouchEnd);

      freshZone.addEventListener('mousedown', handleMouseDown);
      freshZone.addEventListener('mouseup', handleMouseUp);
    };

    async function handleTouchStart(e) {
      e.preventDefault();
      if (isHolding || !currentActiveMessage) return;

      if (e.touches.length === 2) {
        isHolding = true;
        await revealPhotoAndSnap();
      } else if (e.touches.length > 2) {
        triggerSecurityViolation('Too many fingers or unauthorized capture gesture.');
      }
    }

    function handleTouchEnd(e) {
      if (isHolding) {
        stopViewingAndDestroy();
      }
    }

    async function handleMouseDown(e) {
      if (isHolding || !currentActiveMessage) return;
      if (e.shiftKey) {
        isHolding = true;
        await revealPhotoAndSnap();
      }
    }

    function handleMouseUp(e) {
      if (isHolding) {
        stopViewingAndDestroy();
      }
    }

    async function revealPhotoAndSnap() {
      const { id, senderId, senderName } = currentActiveMessage;

      // Capture viewer reaction snapshot and send privately to sender
      const reactionSnap = takeCameraFrame();
      if (reactionSnap) {
        try {
          await addDoc(collection(db, "reactions"), {
            senderId: senderId,
            senderName: senderName,
            viewerName: currentUser.name,
            reactionImage: reactionSnap,
            isViolation: false,
            createdAt: serverTimestamp()
          });
        } catch(e){}
      }

      const canvas = document.getElementById('photo-canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.src = storedImageData;
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
      };

      document.getElementById('hold-instruction').classList.add('hidden');
      canvas.classList.remove('hidden');
      
      const timerContainer = document.getElementById('timer-bar-container');
      const timerBar = document.getElementById('timer-bar');
      timerContainer.classList.remove('hidden');
      timerBar.style.width = '100%';
      setTimeout(() => { timerBar.style.width = '0%'; }, 50);

      // Delete the message immediately so it's a true 1-view photo
      try {
        await deleteDoc(doc(db, "messages", id));
      } catch(e){}

      // 1.3 second auto-expiration timer
      viewTimer = setTimeout(() => {
        stopViewingAndDestroy('Photo expired after 1.3 seconds.');
      }, 1300);
    }

    function stopViewingAndDestroy(reason) {
      if (viewTimer) clearTimeout(viewTimer);
      viewTimer = null;
      isHolding = false;

      const canvas = document.getElementById('photo-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      closeAndDestroyViewer(reason);
    }

    async function triggerSecurityViolation(msg) {
      if (!currentActiveMessage) return;
      const { senderId, senderName } = currentActiveMessage;
      
      const violationSnap = takeCameraFrame();
      try {
        await addDoc(collection(db, "violations"), {
          offenderId: currentUser.id,
          offenderName: currentUser.name,
          senderName: senderName,
          flaggedAt: serverTimestamp()
        });

        if (violationSnap) {
          await addDoc(collection(db, "reactions"), {
            senderId: senderId,
            senderName: senderName,
            viewerName: currentUser.name,
            reactionImage: violationSnap,
            isViolation: true,
            createdAt: serverTimestamp()
          });
        }
      } catch(e){}

      stopViewingAndDestroy(msg || '🚨 Security violation detected.');
    }

    window.closeAndDestroyViewer = (reason) => {
      if (viewTimer) clearTimeout(viewTimer);
      viewTimer = null;
      isHolding = false;

      const zone = document.getElementById('touch-hold-zone');
      zone.removeEventListener('touchstart', handleTouchStart);
      zone.removeEventListener('touchend', handleTouchEnd);
      zone.removeEventListener('touchcancel', handleTouchEnd);
      zone.removeEventListener('mousedown', handleMouseDown);
      zone.removeEventListener('mouseup', handleMouseUp);

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      currentActiveMessage = null;
      storedImageData = null;
      document.getElementById('viewer-modal').classList.add('hidden');
      document.getElementById('viewer-modal').classList.remove('flex');
    };
  </script>
