<script>
  let currentUser = null;

  function handleLogin() {
    const input = document.getElementById('username-input');
    const username = input.value.trim();
    
    if (!username) {
      alert('Please enter a name');
      return;
    }

    currentUser = username;
    document.getElementById('user-display').textContent = `@${currentUser}`;
    document.getElementById('login-modal').classList.add('hidden');
    loadGroupFeed();
  }

  function switchTab(tab) {
    // Hide all tabs
    ['feed', 'reactions', 'logs'].forEach(t => {
      document.getElementById(`view-${t}`).classList.add('hidden');
      const tabBtn = document.getElementById(`tab-${t}`);
      tabBtn.classList.remove('text-cyan-400', 'border-cyan-400');
      tabBtn.classList.add('text-slate-400', 'border-transparent');
    });

    // Activate selected tab
    document.getElementById(`view-${tab}`).classList.remove('hidden');
    const activeBtn = document.getElementById(`tab-${tab}`);
    activeBtn.classList.add('text-cyan-400', 'border-cyan-400');
    activeBtn.classList.remove('text-slate-400', 'border-transparent');
  }

  function openSendModal() {
    document.getElementById('send-modal').classList.remove('hidden');
  }

  function closeSendModal() {
    document.getElementById('send-modal').classList.add('hidden');
  }

  function closeAndDestroyViewer(reason) {
    document.getElementById('viewer-modal').classList.add('hidden');
    console.log(`Viewer closed: ${reason}`);
  }

  function loadGroupFeed() {
    const list = document.getElementById('group-feed-list');
    list.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">No group photos posted yet.</div>`;
  }
</script>
